    <form action="./feedback.html">
        <div>
            <label for="">
                Email:
                <input required type="text" name="userEmail" placeholder="user@gmail.com">
            </label>
        </div>
        <div>
            <label for="">
                Feedback
                <textarea required name="" rows="10">

            </textarea>
            </label>
        </div>
        <div>
            <label for="">
                Gender:
                <select required name="gender" id="">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Others">Others</option>
                </select>
            </label>
        </div>
        <div>
            <label for="">
                Profile Picture:
                <input required type="file" name="" id="">
            </label>
        </div>
        <div>
            <label for="">
                Date of Birth
                <input required type="datetime-local" name="" id="">
            </label>
        </div>
        <div>
            <label for="">
                Portfolio URL
                <input required type="url" name="" id="">
            </label>
        </div>
        <input type="submit" value="Submit">
    </form>
